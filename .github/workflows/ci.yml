name: ci

on:
  push:
    branches: [trunk]
    paths-ignore: ['docs/**', '**.md', LICENSE, .hut.scfg, .builds/**, .build.yml]
  pull_request:
    paths-ignore: ['docs/**', '**.md', LICENSE, .hut.scfg, .builds/**, .build.yml]
  workflow_dispatch:
    inputs:
      lisp:
        description: Run only this Lisp
        type: choice
        options: [all, sbcl, ecl]
        default: all

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lisp: ${{ fromJSON(inputs.lisp == 'sbcl' && '["sbcl"]' || inputs.lisp == 'ecl' && '["ecl"]' || '["sbcl", "ecl"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Lisp
        run: sudo apt-get update && sudo apt-get install -y sbcl ${{ matrix.lisp }}

      - name: Install Quicklisp
        run: |
          curl -sSfLO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --no-userinit --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'
          cp -R "$GITHUB_WORKSPACE" ~/quicklisp/local-projects/trivial-notify

      - name: Test
        run: tests/test.sh ${{ matrix.lisp }}
